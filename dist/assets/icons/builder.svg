<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Металлический бирюзовый градиент бойка/лезвия -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a2f8fb" />
      <stop offset="45%" stop-color="#46c6cd" />
      <stop offset="100%" stop-color="#166c72" />
    </linearGradient>

    <!-- Градиент рукояток -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56c2c7" />
      <stop offset="100%" stop-color="#164e52" />
    </linearGradient>

    <!-- Неоновое свечение для акцента -->
    <filter id="builderGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#46c6cd" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#builderGlow)">
    <!-- 1. Инструмент слева снизу направо вверх (Молоток) -->
    <!-- Рукоять -->
    <rect x="58" y="24" width="12" height="80" rx="6" fill="url(#handleGrad)" stroke="#0c2326" stroke-width="4.5" transform="rotate(45 64 64)" />
    <!-- Головка молотка (справа вверху) -->
    <g transform="rotate(45 64 64)">
      <path d="M51 20 h26 v16 h-26 z" fill="url(#headGrad)" stroke="#0c2326" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Фаска бойка -->
      <path d="M53 14 h22 v6 h-22 z" fill="#a2f8fb" stroke="#0c2326" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- 2. Инструмент справа снизу налево вверх (Кирка билдера) -->
    <!-- Рукоять -->
    <rect x="58" y="24" width="12" height="80" rx="6" fill="url(#handleGrad)" stroke="#0c2326" stroke-width="4.5" transform="rotate(-45 64 64)" />
    <!-- Головка кирки/топорика (слева вверху) -->
    <g transform="rotate(-45 64 64)">
      <!-- Изогнутое лезвие кирки -->
      <path d="M46 22 C56 16, 72 16, 82 22 L77 34 C70 30, 58 30, 51 34 Z" fill="url(#headGrad)" stroke="#0c2326" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Заостренный клюв -->
      <polygon points="46,22 41,27 51,34" fill="#a2f8fb" stroke="#0c2326" stroke-width="4" stroke-linejoin="round" />
    </g>
  </g>
</svg>
