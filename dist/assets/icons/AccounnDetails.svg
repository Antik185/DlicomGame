<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#5ce1e6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Верхние петли-крепления -->
  <line x1="7.5" y1="2" x2="7.5" y2="5" stroke-width="2" />
  <line x1="16.5" y1="2" x2="16.5" y2="5" stroke-width="2" />

  <!-- Корпус календаря со скругленными углами -->
